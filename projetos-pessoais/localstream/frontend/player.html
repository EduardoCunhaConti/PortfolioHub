<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player — LocalStream</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/player.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar__actions">
            <a href="/" class="btn btn--ghost">← Back</a>
            <span class="navbar__title" id="mediaTitle">Loading...</span>
        </div>
        <div class="navbar__actions">
            <button class="theme-toggle" id="themeToggle" title="Change theme">🌙</button>
        </div>
    </nav>

    <main class="player-page">

        <div class="player-wrapper">
            <video
                class="player-video"
                id="videoPlayer"
                controls
                preload="metadata"
            ></video>
        </div>

        <div class="container">
            <div class="player-info">
                <div class="player-info__main">
                    <h1 class="player-info__title" id="infoTitle">—</h1>
                    <span class="player-info__badge" id="infoBadge">—</span>
                </div>
                <div class="player-info__meta">
                    <span class="text-secondary" id="infoDuration">—</span>
                    <span class="text-secondary" id="infoProgress">—</span>
                </div>
            </div>
        </div>

    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/player.js"></script>

</body>
</html>
