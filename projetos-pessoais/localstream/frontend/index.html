<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStream</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/catalog.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="navbar__logo">LocalStream</a>
        <div class="navbar__actions">
            <input
                class="input navbar__search"
                type="text"
                id="searchInput"
                placeholder="Buscar..."
            />
            <a href="/settings" class="btn btn--ghost">⚙️ Settings</a>
            <button class="theme-toggle" id="themeToggle" title="Change theme">🌙</button>
        </div>
    </nav>

    <main class="container page">

        <div class="catalog-filters">
            <button class="filter-btn filter-btn--active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="movie">Movies</button>
            <button class="filter-btn" data-filter="series">Series</button>
        </div>

        <div class="catalog-grid" id="catalogGrid"></div>

        <div class="catalog-empty hidden" id="catalogEmpty">
            <p>No media found.</p>
            <a href="/settings" class="btn btn--primary mt-16">Configure Directory</a>
        </div>

    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/catalog.js"></script>

</body>
</html>
